<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Color Match Studio — an accessible preschool color naming, object matching, and memory game.">
<title>Color Match Studio</title>
<style>
:root{--ink:#312057;--violet:#7146c7;--gold:#ffd64d;--shadow:0 16px 35px #45206c35}
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:24px 14px 48px;text-align:center;color:var(--ink);font-family:"Comic Sans MS","Trebuchet MS",sans-serif;font-weight:300;background:linear-gradient(135deg,#ffb8df,#ffe783,#78e2dc,#aeb8ff);background-size:300% 300%;animation:sky 14s ease infinite}
@keyframes sky{50%{background-position:100% 100%}}main{width:min(920px,100%);margin:auto}h1{font-size:clamp(2.4rem,8vw,4.6rem);margin:.2em 0;color:#5523a6;text-shadow:2px 3px #fff}
.intro,.panel{background:#ffffffdc;border:3px solid #fff;border-radius:28px;padding:16px;box-shadow:var(--shadow)}.controls,.stats{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap}
label{font-size:1.05rem}select,button{font:inherit;font-weight:300;border:2px solid #6033aa;border-radius:15px;padding:10px 14px;background:#fff;color:var(--ink)}button{cursor:pointer;touch-action:manipulation}button:hover{transform:translateY(-2px)}button:focus-visible,select:focus-visible{outline:4px solid var(--gold);outline-offset:3px}
.primary{background:linear-gradient(135deg,#885be0,#6534bd);color:#fff}.sound[aria-pressed="true"]{background:#dfffea}.board{display:grid;grid-template-columns:repeat(4,minmax(90px,1fr));gap:14px;margin-top:18px}
.card{min-height:120px;border:4px solid #fff;border-radius:22px;box-shadow:0 7px 16px #32166340;background:linear-gradient(145deg,#6f49c5,#3b277e);color:#fff;font-size:1.05rem;display:grid;place-items:center;padding:8px;transition:.2s}
.card .face{display:none}.card.revealed .face,.card.matched .face{display:grid;place-items:center;gap:4px}.card.revealed .cover,.card.matched .cover{display:none}.swatch{width:64px;height:54px;border-radius:15px;border:3px solid #fff;box-shadow:0 2px 6px #0003}.object{font-size:2.7rem}.card.matched{background:#e3ffdc;color:#214d27;border-color:#62c85d}.card:disabled{opacity:1;cursor:default}
.stats{margin:15px 0}.stat{background:#fff;border-radius:999px;padding:8px 14px}.message{min-height:34px;font-size:1.3rem;margin:14px;font-weight:300}.finish{margin-top:14px;background:#fff4b5;border-radius:20px;padding:14px}.finish[hidden]{display:none}
@media(max-width:650px){.board{grid-template-columns:repeat(2,1fr)}.card{min-height:105px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<link rel="stylesheet" href="../assets/preschool-playful-theme.css" data-preschool-playful-theme>
<script src="../assets/preschool-learner-storage.js" data-preschool-learner-storage></script>
</head>
<body><main>
<h1>🎨 Color Match Studio</h1>
<section class="intro"><p>Find each matching pair. Practice color names, match colors to familiar objects, or play a classic memory round.</p>
<div class="controls">
<label for="mode">Learning mode <select id="mode"><option value="names">Color + name</option><option value="objects">Color + object</option><option value="memory">Color memory</option></select></label>
<label for="difficulty">Pairs <select id="difficulty"><option value="2">2 · Gentle</option><option value="4" selected>4 · Growing</option><option value="6">6 · Challenge</option></select></label>
<button type="button" class="primary" id="newGame">🌈 New Round</button><button type="button" class="sound" id="sound" aria-pressed="true">🔊 Sound On</button>
</div></section>
<div class="stats" aria-label="Round progress"><span class="stat">Pairs <strong id="pairs">0 / 4</strong></span><span class="stat">Tries <strong id="tries">0</strong></span><span class="stat">Best <strong id="best">—</strong></span></div>
<section class="panel" aria-labelledby="gameTitle"><h2 id="gameTitle">Find the matching pairs</h2><div class="board" id="board"></div><div class="message" id="message" role="status" aria-live="polite">Choose your first card.</div><div class="finish" id="finish" hidden><strong>⭐ Round complete!</strong><p id="summary"></p><button type="button" class="primary" id="nextRound">Play the Next Round</button></div></section>
</main>
<script>
const COLORS=[
 {name:'red',hex:'#e53935',object:'🍎',thing:'apple'},{name:'blue',hex:'#2684ff',object:'🐳',thing:'whale'},
 {name:'yellow',hex:'#f6c900',object:'🌻',thing:'sunflower'},{name:'green',hex:'#37a94b',object:'🐸',thing:'frog'},
 {name:'orange',hex:'#f58220',object:'🍊',thing:'orange'},{name:'purple',hex:'#8a45c7',object:'🍇',thing:'grapes'}
],KEY='color-match-studio-v2',$=id=>document.getElementById(id);
let first=null,lock=false,pairs=0,tries=0,soundOn=true,roundColors=[];
function load(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch{return{}}}
function save(data){const old=load();localStorage.setItem(KEY,JSON.stringify({...old,...data}))}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
let audioContext;
function tone(f,d=.13,delay=0,type='sine'){if(!soundOn)return;const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio)return;audioContext=audioContext||new Audio();if(audioContext.state==='suspended')audioContext.resume();const t=audioContext.currentTime+delay,o=audioContext.createOscillator(),g=audioContext.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(.13,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(audioContext.destination);o.start(t);o.stop(t+d)}
function speak(text){if(!soundOn||!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.rate=.82;speechSynthesis.speak(u)}
function face(color,variant){const mode=$('mode').value;if(mode==='objects'&&variant===1)return `<span class="object" aria-hidden="true">${color.object}</span><span>${color.thing}</span>`;const label=mode==='memory'?'color':color.name;return `<span class="swatch" style="background:${color.hex}" aria-hidden="true"></span><span>${label}</span>`}
function card(color,variant,index){const b=document.createElement('button');b.type='button';b.className='card';b.dataset.color=color.name;b.setAttribute('aria-label',`Hidden card ${index+1}`);b.innerHTML=`<span class="cover" aria-hidden="true">✨<br>Pick me</span><span class="face">${face(color,variant)}</span>`;b.onclick=()=>flip(b,color);return b}
function update(){const total=roundColors.length;$('pairs').textContent=`${pairs} / ${total}`;$('tries').textContent=tries;const best=load().best?.[`${$('mode').value}-${total}`];$('best').textContent=best||'—'}
function startGame(){first=null;lock=false;pairs=0;tries=0;$('finish').hidden=true;$('message').textContent='Choose your first card.';const total=Number($('difficulty').value);roundColors=shuffle([...COLORS]).slice(0,total);const deck=shuffle(roundColors.flatMap(c=>[[c,0],[c,1]]));$('board').replaceChildren(...deck.map(([c,v],i)=>card(c,v,i)));update();save({mode:$('mode').value,difficulty:String(total),soundOn})}
function reveal(b,color){b.classList.add('revealed');b.setAttribute('aria-label',`${color.name} card, revealed`)}
function hide(b){b.classList.remove('revealed');b.setAttribute('aria-label','Hidden card')}
function flip(b,color){if(lock||b===first||b.classList.contains('matched'))return;reveal(b,color);speak(color.name);if(!first){first=b;$('message').textContent=`${color.name}. Now find its match.`;return}tries++;if(first.dataset.color===b.dataset.color){const old=first;old.classList.add('matched');b.classList.add('matched');old.disabled=true;b.disabled=true;pairs++;first=null;tone(523);tone(659,.13,.14);$('message').textContent=`Great match — ${color.name}!`;update();if(pairs===roundColors.length)complete()}else{lock=true;const old=first;$('message').textContent=`${old.dataset.color} and ${color.name} are different. Try again.`;tone(190,.18,0,'triangle');setTimeout(()=>{hide(old);hide(b);first=null;lock=false},850);update()}}
function complete(){const total=roundColors.length,key=`${$('mode').value}-${total}`,state=load(),previous=state.best?.[key],newBest=!previous||tries<previous;save({rounds:(state.rounds||0)+1,best:{...(state.best||{}),[key]:newBest?tries:previous}});$('summary').textContent=`You matched ${total} pairs in ${tries} tries.${newBest?' New best!':''}`;$('finish').hidden=false;$('message').textContent='You completed the round!';tone(523);tone(659,.16,.15);tone(784,.2,.31);update()}
function restore(){const s=load();if(['names','objects','memory'].includes(s.mode))$('mode').value=s.mode;if(['2','4','6'].includes(s.difficulty))$('difficulty').value=s.difficulty;soundOn=s.soundOn!==false;updateSound();startGame()}
function updateSound(){$('sound').setAttribute('aria-pressed',String(soundOn));$('sound').textContent=soundOn?'🔊 Sound On':'🔇 Sound Off'}
$('sound').onclick=()=>{soundOn=!soundOn;updateSound();save({soundOn});$('message').textContent=soundOn?'Sound is on.':'Sound is off.'};$('newGame').onclick=startGame;$('nextRound').onclick=startGame;$('mode').onchange=startGame;$('difficulty').onchange=startGame;restore();
</script>
<script src="/assets/vnv-beta-link.js" defer></script>
</body></html>
