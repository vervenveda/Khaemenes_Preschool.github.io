name: Preschool Family Reporting
on:
  workflow_dispatch:
  push:
    branches: [audit/preschool-family-report-2026-11-09]
    paths:
      - index.html
      - assets/khaemenes-preschool-continuation.js
      - assets/khaemenes-prek-family-progress.js
      - assets/khaemenes-prek-family-day.js
      - student-profile/index.html
      - tests/preschool-family-report.test.cjs
      - tests/prek-family-browser-check.html
      - .github/workflows/preschool-family-report.yml
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/preschool-family-report.test.cjs
      - name: Headless Chromium with fictional learners
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/prek-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in 1 2 3 4 5; do
            if curl -fsS http://127.0.0.1:8765/tests/prek-family-browser-check.html >/dev/null; then break; fi
            sleep 1
          done
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME" || { echo "No Chromium browser available"; exit 1; }
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=4000 --dump-dom "http://127.0.0.1:8765/tests/prek-family-browser-check.html" > /tmp/prek-browser-dom.html
          grep -F 'id="result" data-result="PASS"' /tmp/prek-browser-dom.html
