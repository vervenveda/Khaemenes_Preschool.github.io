name: Preschool source regression
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate every Preschool source surface
        run: node tools/validate-preschool-repository.mjs
      - name: Test learner-scoped storage migration and isolation
        run: node tools/preschool-learner-storage-regression.mjs
      - name: Test Preschool learner-scoped home dashboard and Mentor context
        run: node tools/preschool-home-ownership-regression.mjs
      - name: Test Preschool PE curriculum and evidence contracts
        run: node tools/preschool-pe-regression.mjs
