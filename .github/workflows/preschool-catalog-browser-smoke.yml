name: Preschool catalog browser smoke
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "assets/vnv-beta-link.js"
      - "assets/preschool-catalog.js"
      - "assets/preschool-playful-theme.css"
      - "apps/**"
      - "tools/preschool-catalog-browser-smoke.mjs"
      - ".github/workflows/preschool-catalog-browser-smoke.yml"
  pull_request:
    paths:
      - "index.html"
      - "assets/vnv-beta-link.js"
      - "assets/preschool-playful-theme.css"
      - "assets/preschool-catalog.js"
      - "apps/**"
      - "tools/preschool-catalog-browser-smoke.mjs"
      - ".github/workflows/preschool-catalog-browser-smoke.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  catalog-browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: npm install --no-save --no-package-lock playwright
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Smoke-test representative Preschool catalog categories
        run: node tools/preschool-catalog-browser-smoke.mjs
